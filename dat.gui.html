<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js - Position GUI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; } /* Prevents scrollbars */
        #threejs-container { width: 100%; height: 100vh; }
    </style>
    <!-- Load Three.js and dat.GUI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
</head>
<body>
    <div id="threejs-container"></div>
    <script>
        // 1. Setup the GUI (The control panel)
        const gui = new dat.GUI();

        // 2. Scene Setup (The Stage)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x262626);

        // 3. Camera Setup (The Eye)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 10;

        // 4. The Object (The Actor)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 5. Connect GUI to the Object
        gui.add(material, 'wireframe').name("Show Skeleton");
        gui.add(cube.position, 'x', -5, 5).name("Move Left/Right");
        gui.add(cube.position, 'y', -5, 5).name("Move Up/Down");
        gui.add(cube.position, 'z', -5, 5).name("Move Forward/Back");

        // 6. Renderer (The Camera Lens/Projector)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('threejs-container').appendChild(renderer.domElement);

        // 7. Animation Loop (The Movie Frames)
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
