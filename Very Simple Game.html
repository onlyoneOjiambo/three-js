<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js FPS - Guaranteed Wall Collision</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; background: #000; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; display: block; }
        #crosshair { position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        #ui { position: fixed; top: 10px; left: 10px; color: white; font-family: monospace; font-size: 16px; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 1px 1px 2px black; background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 4px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; cursor: pointer; z-index: 20; }
        #overlay h1 { margin: 0 0 10px; font-size: 2rem; }
        #overlay p { margin: 0; opacity: 0.8; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="crosshair"></div>
    <div id="ui">❤️ 10 | 🔥 0 | Score: 0 | Enemies: 0</div>
    <div id="overlay">
        <h1>CLICK TO START</h1>
        <p>Arrow Keys: Move | Mouse: Look | Click: Shoot</p>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: false, enableOfflineSupport: false });
        const uiEl = document.getElementById("ui");
        const overlay = document.getElementById("overlay");

        let scene, camera, shadowGen;
        let gameActive = false;
        let playerHealth = 10;
        let superAmmo = 0;
        const MAX_HEALTH = 15;
        let score = 0;
        const playerBullets = [];
        const enemyBullets = [];
        const enemies = [];
        const obstacles = [];
        const pickups = [];
        const mats = {};
        const MAX_ENEMIES = 10;
        const keys = { up: false, down: false, left: false, right: false };

        // Input Handler
        window.addEventListener("keydown", (e) => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
            if(e.key === "ArrowUp") keys.up = true;
            if(e.key === "ArrowDown") keys.down = true;
            if(e.key === "ArrowLeft") keys.left = true;
            if(e.key === "ArrowRight") keys.right = true;
        });
        window.addEventListener("keyup", (e) => {
            if(e.key === "ArrowUp") keys.up = false;
            if(e.key === "ArrowDown") keys.down = false;
            if(e.key === "ArrowLeft") keys.left = false;
            if(e.key === "ArrowRight") keys.right = false;
        });

        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

        function createScene() {
            const sc = new BABYLON.Scene(engine);
            sc.clearColor = new BABYLON.Color3(0.3, 0.65, 1.0); // Blue Sky
            sc.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            sc.fogDensity = 0.015;

            camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 2, -10), sc);
            camera.setTarget(new BABYLON.Vector3(0, 2, 0));
            camera.keysUp = []; camera.keysDown = []; camera.keysLeft = []; camera.keysRight = [];
            camera.angularSensibility = 1500;
            camera.minZ = 0.1;

            // Lighting & Phong Shading
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), sc);
            hemi.intensity = 0.5; hemi.diffuse = new BABYLON.Color3(0.9, 0.95, 1); hemi.groundColor = new BABYLON.Color3(0.1, 0.2, 0.1);
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1,-2.5,1.5), sc);
            sun.position = new BABYLON.Vector3(40,60,40); sun.intensity = 2.2; sun.specular = new BABYLON.Color3(1,1,1);
            shadowGen = new BABYLON.ShadowGenerator(2048, sun);
            shadowGen.useBlurExponentialShadowMap = true; shadowGen.blurKernel = 24;

            // Materials
            mats.phong = new BABYLON.StandardMaterial("phong", sc);
            mats.phong.specularColor = new BABYLON.Color3(1,1,1); mats.phong.specularPower = 64; mats.phong.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);
            mats.ground = mats.phong.clone("gnd"); mats.ground.diffuseColor = new BABYLON.Color3(0.12, 0.35, 0.12);
            mats.obs = mats.phong.clone("obs"); mats.obs.diffuseColor = new BABYLON.Color3(1, 1, 1); mats.obs.specularPower = 48;
            mats.enemy = mats.phong.clone("enm"); mats.enemy.diffuseColor = new BABYLON.Color3(0.85, 0.1, 0.1); mats.enemy.specularColor = new BABYLON.Color3(1,0.4,0.4);
            mats.pBullet = new BABYLON.StandardMaterial("pB"); mats.pBullet.emissiveColor = new BABYLON.Color3(1,1,0.3);
            mats.eBullet = new BABYLON.StandardMaterial("eB"); mats.eBullet.emissiveColor = new BABYLON.Color3(1,0.1,0.1);
            mats.heart = new BABYLON.StandardMaterial("hrt"); mats.heart.emissiveColor = new BABYLON.Color3(0.6, 0.1, 0.15); mats.heart.diffuseColor = new BABYLON.Color3(1, 0.2, 0.3);
            mats.ammo = new BABYLON.StandardMaterial("ammo"); mats.ammo.emissiveColor = new BABYLON.Color3(0.7, 0.6, 0); mats.ammo.diffuseColor = new BABYLON.Color3(1, 0.85, 0);
            mats.super = new BABYLON.StandardMaterial("sup"); mats.super.emissiveColor = new BABYLON.Color3(1, 0, 1);

            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:100, height:100}, sc);
            ground.material = mats.ground; ground.receiveShadows = true;

            // Obstacles
            const configs = [
                { w:3, h:5, d:3, x:-20, z:-20 }, { w:3, h:5, d:3, x:20, z:-20 },
                { w:3, h:5, d:3, x:-20, z:20 }, { w:3, h:5, d:3, x:20, z:20 },
                { w:4, h:3, d:2, x:-15, z:0 }, { w:4, h:3, d:2, x:15, z:0 },
                { w:2, h:3, d:4, x:0, z:-15 }, { w:2, h:3, d:4, x:0, z:15 },
                { w:2, h:2, d:2, x:-10, z:-10 }, { w:2, h:2, d:2, x:10, z:-10 },
                { w:2, h:2, d:2, x:-10, z:10 }, { w:2, h:2, d:2, x:10, z:10 },
                { w:6, h:2.5, d:1.5, x:-25, z:-5 }, { w:6, h:2.5, d:1.5, x:25, z:5 },
                { w:1.5, h:2.5, d:6, x:5, z:-25 }, { w:1.5, h:2.5, d:6, x:-5, z:25 }
            ];
            configs.forEach((c, i) => {
                const box = BABYLON.MeshBuilder.CreateBox("w"+i, {width:c.w, height:c.h, depth:c.d}, sc);
                box.position = new BABYLON.Vector3(c.x, c.h/2, c.z);
                box.material = mats.obs; box.checkCollisions = true; box.receiveShadows = true; box.isPickable = true;
                shadowGen.addShadowCaster(box); obstacles.push(box);
            });

            spawnPickup('heart'); spawnPickup('ammo');
            spawnEnemies(8);
            return sc;
        }

        function spawnPickup(type) {
            if(pickups.length > 6) return;
            let m = type === 'heart' 
                ? BABYLON.MeshBuilder.CreateTorus("p"+type, {diameter:1.2, thickness:0.4}, scene)
                : BABYLON.MeshBuilder.CreateBox("p"+type, {size:0.9}, scene);
            m.material = type === 'heart' ? mats.heart : mats.ammo;
            const a = Math.random()*Math.PI*2, d = 8+Math.random()*25;
            m.position = new BABYLON.Vector3(Math.cos(a)*d, 2.5, Math.sin(a)*d);
            m.checkCollisions = false; m.isPickable = true;
            m.metadata = { type, baseY: 2.5, phase: Math.random()*Math.PI*2 };
            pickups.push(m);
        }

        function spawnEnemies(count) {
            for(let i=0; i<count; i++) {
                if(enemies.length >= MAX_ENEMIES) break;
                const e = BABYLON.MeshBuilder.CreateCylinder("en", {height:3, diameter:1.6, tessellation:16}, scene);
                const a = Math.random()*Math.PI*2, d = 12+Math.random()*18;
                e.position = new BABYLON.Vector3(Math.cos(a)*d, 1.5, Math.sin(a)*d);
                e.material = mats.enemy; e.checkCollisions = true; e.receiveShadows = true; e.isPickable = true;
                shadowGen.addShadowCaster(e); enemies.push(e);
                e.metadata = {hp:3, lastShot:0, interval:1.0+Math.random()*0.5, strafe:Math.random()*Math.PI*2, timer:1.5, dodgeCD:0};
            }
        }

        function updateUI() { uiEl.textContent = `❤️ ${playerHealth} | 🔥 ${superAmmo} | Score: ${score} | Enemies: ${enemies.length}`; }

        function update() {
            if(!gameActive) return;
            const dt = Math.min(engine.getDeltaTime()/1000, 0.04);
            const time = performance.now()/1000;

            // 1. MOVEMENT (ARROW KEYS)
            const fwd = camera.getDirection(new BABYLON.Vector3(0,0,1));
            const rgt = camera.getDirection(new BABYLON.Vector3(1,0,0));
            fwd.y=0; fwd.normalize(); rgt.y=0; rgt.normalize();
            let mv = new BABYLON.Vector3(0,0,0);
            if(keys.up) mv.addInPlace(fwd);
            if(keys.down) mv.subtractInPlace(fwd);
            if(keys.right) mv.addInPlace(rgt);
            if(keys.left) mv.subtractInPlace(rgt);
            
            if(mv.length()>0) { mv.normalize().scaleInPlace(0.15); camera.position.addInPlace(mv); }
            camera.position.y = 2.0;
            camera.position.x = clamp(camera.position.x, -45, 45);
            camera.position.z = clamp(camera.position.z, -45, 45);

            // Wall pushout (keeps player outside walls)
            for(const o of obstacles) {
                const dist = BABYLON.Vector3.Distance(camera.position, o.position);
                const safeDist = 1.2 + Math.max(o.scaling.x, o.scaling.z)*0.5;
                if(dist < safeDist) {
                    const push = camera.position.subtract(o.position).normalize();
                    camera.position.copyFrom(o.position).addInPlace(push.scale(safeDist));
                }
            }

            // 2. PICKUPS
            for(let i=pickups.length-1; i>=0; i--) {
                const p = pickups[i];
                if(!p || p.isDisposed()) { pickups.splice(i,1); continue; }
                p.position.y = p.metadata.baseY + Math.sin(time*2 + p.metadata.phase)*0.4;
                p.rotation.y += dt*1.5;
                if(BABYLON.Vector3.Distance(p.position, camera.position) < 1.6) {
                    if(p.metadata.type==='heart') playerHealth = Math.min(playerHealth+5, MAX_HEALTH);
                    else superAmmo = Math.min(superAmmo+3, 6);
                    updateUI(); p.dispose(); pickups.splice(i,1);
                    setTimeout(()=>spawnPickup(p.metadata.type), 4000+Math.random()*3000);
                }
            }

            // 3. PLAYER BULLETS (SUB-STEPPING COLLISION - GUARANTEED NO TUNNELING)
            const subSteps = 4;
            for(let i=playerBullets.length-1; i>=0; i--) {
                const b = playerBullets[i]; 
                if(!b || b.isDisposed()) { playerBullets.splice(i,1); continue; }
                const md = b.metadata;
                
                // Falling state (hit wall/enemy and dropped)
                if(md.fallen) {
                    md.vy -= 10 * dt;
                    b.position.y += md.vy * dt;
                    if(b.position.y <= 0.15) {
                        b.position.y = 0.15; md.vy = 0;
                        md.groundTime = (md.groundTime||0) + dt;
                        if(md.groundTime > 1.5) { b.dispose(); playerBullets.splice(i,1); }
                    }
                    continue;
                }

                // Move in tiny steps to prevent tunneling
                const stepDist = (md.speed * dt) / subSteps;
                let hitThisFrame = false;

                for(let s=0; s<subSteps; s++) {
                    b.position.addInPlace(md.dir.scale(stepDist));

                    // Check Obstacles
                    for(let o=0; o<obstacles.length; o++) {
                        const obs = obstacles[o];
                        if(!obs || obs.isDisposed()) continue;
                        if(b.intersectsMesh(obs, true)) {
                            hitThisFrame = true;
                            md.fallen = true; md.vy = 0; md.groundTime = 0;
                            b.position.addInPlace(md.dir.scale(-stepDist*0.5)); // Back off slightly
                            break;
                        }
                    }
                    if(hitThisFrame) break;

                    // Check Enemies
                    for(let e=enemies.length-1; e>=0; e--) {
                        const en = enemies[e];
                        if(!en || en.isDisposed()) continue;
                        if(b.intersectsMesh(en, true)) {
                            en.metadata.hp = md.isSuper ? 0 : en.metadata.hp - 1;
                            if(en.metadata.hp <= 0) {
                                shadowGen.removeShadowCaster(en);
                                en.dispose(); enemies.splice(e, 1);
                                score += md.isSuper ? 150 : 100; updateUI();
                                setTimeout(()=>spawnEnemies(2), 800);
                            }
                            b.dispose(); playerBullets.splice(i, 1);
                            hitThisFrame = true; // Flag to skip further steps
                            break;
                        }
                    }
                    if(hitThisFrame) break;
                }

                // Lifetime check
                md.life -= dt;
                if(md.life <= 0 && !md.fallen) {
                    md.fallen = true; md.vy = 0; md.groundTime = 0;
                }
            }

            // 4. ENEMY AI & SHOOTING
            for(const e of enemies) {
                if(!e || e.isDisposed()) continue;
                const m = e.metadata;
                const toPlr = camera.position.subtract(e.position);
                const dist = toPlr.length();

                // Dodge
                if(m.dodgeCD>0) m.dodgeCD-=dt;
                else for(const b of playerBullets) {
                    if(b.metadata.fallen) continue;
                    if(BABYLON.Vector3.Distance(b.position, e.position)<5) {
                        const dot = BABYLON.Vector3.Dot(b.metadata.dir, e.position.subtract(b.position).normalize());
                        if(dot>0.3) {
                            const perp = BABYLON.Vector3.Cross(b.metadata.dir, new BABYLON.Vector3(0,1,0)).normalize();
                            e.position.addInPlace(perp.add(toPlr.normalize().scale(-1)).normalize().scale(12*dt));
                            m.dodgeCD=0.5; break;
                        }
                    }
                }

                // Move & Maintain Distance
                if(m.timer<=0){ m.strafe+=(Math.random()-0.5)*1.5; m.timer=1.2+Math.random(); }
                m.timer-=dt;
                const sDir = new BABYLON.Vector3(
                    Math.cos(m.strafe)*toPlr.z - Math.sin(m.strafe)*toPlr.x, 0,
                    Math.sin(m.strafe)*toPlr.z + Math.cos(m.strafe)*toPlr.x
                ).normalize();
                let moveE = sDir;
                if(dist<6) moveE.addInPlace(toPlr.normalize().scale(-1.2));
                else if(dist>15) moveE.addInPlace(toPlr.normalize().scale(0.6));
                moveE.normalize();
                e.position.addInPlace(moveE.scale(4.0*dt));
                e.position.y=1.5; e.position.x=clamp(e.position.x,-40,40); e.position.z=clamp(e.position.z,-40,40);

                // Precise Aim
                const sp = new BABYLON.Vector3(e.position.x, e.position.y+0.7, e.position.z);
                const tp = new BABYLON.Vector3(camera.position.x, camera.position.y-0.5, camera.position.z);
                const dir = tp.subtract(sp).normalize();
                e.rotation.y = Math.atan2(dir.x, dir.z) + Math.PI;

                // Shoot
                if(time - m.lastShot > m.interval) {
                    m.lastShot = time;
                    const eb = BABYLON.MeshBuilder.CreateSphere("eb", {diameter:0.4}, scene);
                    eb.material = mats.eBullet; eb.position.copyFrom(sp); eb.checkCollisions=true;
                    eb.metadata = {dir:dir, speed:14, life:2.5};
                    enemyBullets.push(eb);
                }
            }

            // 5. ENEMY BULLETS & PLAYER DAMAGE
            for(let i=enemyBullets.length-1; i>=0; i--) {
                const b = enemyBullets[i];
                if(!b || b.isDisposed()) { enemyBullets.splice(i,1); continue; }
                b.position.addInPlace(b.metadata.dir.scale(b.metadata.speed*dt));
                b.metadata.life -= dt;
                const pc = new BABYLON.Vector3(camera.position.x, camera.position.y-0.5, camera.position.z);
                if(BABYLON.Vector3.Distance(b.position, pc)<0.85 || b.metadata.life<=0) {
                    if(BABYLON.Vector3.Distance(b.position, pc)<0.85) {
                        playerHealth--; updateUI();
                        if(playerHealth<=0) gameOver();
                    }
                    b.dispose(); enemyBullets.splice(i,1);
                }
            }
        }

        function gameOver() {
            gameActive=false;
            overlay.querySelector("h1").textContent="GAME OVER";
            overlay.querySelector("p").textContent=`Final Score: ${score} | Click to Restart`;
            overlay.classList.remove("hidden");
            document.exitPointerLock();
        }

        function resetGame() {
            playerHealth=10; superAmmo=0; score=0; gameActive=true; updateUI();
            overlay.querySelector("h1").textContent="CLICK TO START";
            overlay.querySelector("p").textContent="Arrow Keys: Move | Mouse: Look | Click: Shoot";
            playerBullets.forEach(b=>b.dispose()); playerBullets.length=0;
            enemyBullets.forEach(b=>b.dispose()); enemyBullets.length=0;
            enemies.forEach(e=>{shadowGen.removeShadowCaster(e);e.dispose();}); enemies.length=0;
            pickups.forEach(p=>p.dispose()); pickups.length=0;
            camera.position=new BABYLON.Vector3(0,2,-10); camera.rotation.y=0; camera.rotation.x=0;
            spawnPickup('heart'); spawnPickup('ammo'); spawnEnemies(8);
        }

        window.addEventListener("DOMContentLoaded", () => {
            try {
                canvas.style.width="100%"; canvas.style.height="100%";
                canvas.tabIndex=1; canvas.focus();
                engine.resize();
                scene = createScene();
                engine.runRenderLoop(() => { update(); scene.render(); });
                window.addEventListener("resize", () => engine.resize());

                canvas.addEventListener("mousedown", (e) => {
                    if(e.button!==0) return;
                    if(!document.pointerLockElement) { canvas.requestPointerLock(); return; }
                    if(gameActive) {
                        const dir = camera.getDirection(new BABYLON.Vector3(0,0,1)).normalize();
                        const b = BABYLON.MeshBuilder.CreateSphere("pb", {diameter:0.3}, scene);
                        b.position.copyFrom(camera.position).addInPlace(dir.scale(1.5));
                        b.position.y -= 0.6; b.checkCollisions=true; b.isPickable=true;
                        if(superAmmo>0) {
                            b.material=mats.super;
                            b.metadata={dir:dir.clone(), speed:65, life:2.5, isSuper:true, fallen:false};
                            superAmmo--; updateUI();
                        } else {
                            b.material=mats.pBullet;
                            b.metadata={dir:dir.clone(), speed:50, life:2, isSuper:false, fallen:false};
                        }
                        playerBullets.push(b);
                    }
                });

                document.addEventListener("pointerlockchange", () => {
                    if(document.pointerLockElement) { overlay.classList.add("hidden"); camera.attachControl(canvas, true); canvas.focus(); }
                    else { overlay.classList.remove("hidden"); camera.detachControl(); }
                });

                overlay.addEventListener("click", () => { if(!gameActive) resetGame(); canvas.requestPointerLock(); });
            } catch(err) {
                console.error("FPS Error:", err);
                document.body.innerHTML=`<div style="color:red;padding:30px;font-family:monospace;text-align:center;"><h2>Failed to Load</h2><p>${err.message}</p></div>`;
            }
        });
    </script>
</body>
</html>
