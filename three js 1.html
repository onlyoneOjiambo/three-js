<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta charset="UTF-8" />
    <title>Three.js - Hello cube</title>
    <style>
        /* Our CSS goes here */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Oxygen,
                Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }

        html,
        body {
            height: 100vh;
            width: 100vw;
        }

        #threejs-container {
            position: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r127/three.min.js">

    </script>

</head>

<body>
    <div id="threejs-container">
        <!-- Our output to be rendered here -->
    </div>
    <script type="module">
        // our JavaScript code goes here

        const width = window.innerWidth
        const height = window.innerHeight
        // Scene
        const scene = new THREE.Scene()
        scene.background = new THREE.Color('#00b140')
        // Camera
        const fov = 45 // AKA Field of View Three.js 12
        const aspect = window.innerWidth / window.innerHeight
        const near = 0.1 // the near clipping plane
        const far = 100 // the far clipping plane
        const camera = new THREE.PerspectiveCamera(fov, aspect, near, far)
        camera.position.set(0, 0, 10)
        // Renderer
        const renderer = new THREE.WebGLRenderer()
        renderer.setSize(window.innerWidth, window.innerHeight)
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
        // Creating a cube
        const geometry = new THREE.BoxGeometry(2, 2, 2)
        const material = new THREE.MeshBasicMaterial({ wireframe: true })
        const cube = new THREE.Mesh(geometry, material)
        scene.add(cube)
        // Rendering the scene
        const container = document.querySelector('#threejs-container')
        container.append(renderer.domElement)
        renderer.render(scene, camera)

    </script>
</body>

</html>
